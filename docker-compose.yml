services:
  item-app:
    image: ghcr.io/ikbalbbm121/ikbalbbm120/item-app:v1
    restart: always # Selalu restart jika aplikasi crash
    ports:
      - "80:8080"
    depends_on:
      - item-db

  item-db:
    image: mongo:3
    restart: always # Selalu restart jika database crash
    volumes:
      - app-db:/data/db

volumes:
  app-db:
