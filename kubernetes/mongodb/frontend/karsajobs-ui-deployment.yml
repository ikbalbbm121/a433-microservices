apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karsajobs-ui
  template:
    metadata:
      labels:
        app: karsajobs-ui
    spec:
      containers:
      - name: karsajobs-ui
        # Menggunakan image frontend dari GHCR sesuai saran
        image: ghcr.io/ikbalbbm120/karsajobs-ui:latest
        ports:
        # Ubah port ini agar sama dengan EXPOSE di Dockerfile karsajobs-ui
        - containerPort: 8080